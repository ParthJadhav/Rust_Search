[package]
name = "rust_search"
version = "2.2.0"
description = "Blazingly fast file search library built in Rust"
edition = "2021"
rust-version = "1.88"
authors = ["Parth Jadhav <jadhavparth99@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/ParthJadhav/rust_search"
keywords = ["search", "files", "directories", "library"]
categories = ["filesystem", "algorithms"]
include = [
    "/.github/**",
    "/benches/**",
    "/benchmarks/**",
    "/examples/**",
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/BENCHMARKS.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/README.md",
    "/ROADMAP.md",
    "/learnings.md",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ignore = "0.4"
dirs = "6"
strsim = "0.11"
crossbeam-channel = "0.5.15"
rayon = "1.11.0"

[[bench]]
name = "bench_search"
harness = false
